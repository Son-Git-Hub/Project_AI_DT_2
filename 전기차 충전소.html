<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EV-Finder Seoul: 실시간 전기차 충전소 찾기</title>

  <!-- 폰트 & 아이콘 -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

  <!-- ====== index.css 통합 ====== -->
  <style>
:root {
  --background-color: #121212;
  --surface-color: #1e1e1e;
  --primary-color: #00e676; /* Bright Green */
  --primary-variant-color: #00a152;
  --secondary-color: #bb86fc;
  --on-background-color: #e0e0e0;
  --on-surface-color: #ffffff;
  --border-color: #333;
  --success-color: #00e676;
  --error-color: #cf6679;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background-color: var(--background-color); color: var(--on-background-color); line-height: 1.6; }
#root { display: flex; flex-direction: column; min-height: 100vh; }
.app-header { background-color: var(--surface-color); padding: 1.5rem 2rem; border-bottom: 1px solid var(--border-color); text-align: center; }
.app-header h1 { display: flex; align-items: center; justify-content: center; gap: .5rem; font-size: 2rem; color: var(--on-surface-color); margin-bottom: .25rem; }
.app-header h1 .material-icons { font-size: 2.5rem; color: var(--primary-color); }
.app-header p { color: var(--on-background-color); font-size: 1rem; }
.container { display: grid; grid-template-columns: 320px 1fr; gap: 2rem; padding: 2rem; width: 100%; max-width: 1600px; margin: 0 auto; flex-grow: 1; }
.controls { background-color: var(--surface-color); padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color); align-self: start; position: sticky; top: 2rem; }
.controls h2 { font-size: 1.5rem; color: var(--on-surface-color); margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
.form-group { margin-bottom: 1.5rem; }
.form-group label { display: block; font-weight: 500; margin-bottom: .5rem; color: var(--secondary-color); }
.form-group select, .form-group button {
  width: 100%; padding: .8rem; border-radius: 8px; border: 1px solid var(--border-color);
  background-color: #2c2c2c; color: var(--on-background-color); font-size: 1rem; font-family: 'Noto Sans KR', sans-serif;
  transition: border-color .3s ease, box-shadow .3s ease;
}
.form-group select:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(0,230,118,.2); }
.search-button { background-color: var(--primary-variant-color); color: var(--on-surface-color); font-weight: 700; border: none; cursor: pointer; transition: background-color .3s ease; display: flex; justify-content: center; align-items: center; gap: .5rem; }
.search-button .material-icons { font-size: 1.25rem; }
.search-button:hover:not(:disabled) { background-color: var(--primary-color); color: #000; }
.search-button:disabled { background-color: #333; cursor: not-allowed; opacity: .6; }
.results { min-height: 400px; }
.results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
.loader, .message-box {
  display: flex; justify-content: center; align-items: center; flex-direction: column;
  padding: 2rem; background-color: var(--surface-color); border-radius: 12px; border: 1px solid var(--border-color);
  height: 100%; min-height: 300px; text-align: center;
}
.message-box.initial-prompt .material-icons { font-size: 4rem; color: var(--secondary-color); margin-bottom: 1rem; }
.spinner { border: 4px solid rgba(255,255,255,.2); border-left-color: var(--primary-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }
.message-box p { font-size: 1.1rem; font-weight: 500; }
.message-box.error { color: var(--error-color); border-color: var(--error-color); }
.charger-card { background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; transition: transform .2s ease-in-out, box-shadow .2s ease-in-out, border-color .2s ease-in-out; cursor: pointer; }
.charger-card:hover, .charger-card:focus { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,.3); border-color: var(--primary-color); outline: none; }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
.card-header h3 { font-size: 1.2rem; color: var(--on-surface-color); }
.status-badge { padding: .25rem .75rem; border-radius: 16px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.status-badge.available { background-color: rgba(0,230,118,.15); color: var(--success-color); }
.card-body .info-item { display: flex; align-items: flex-start; gap: .75rem; margin-bottom: .5rem; }
.card-body .info-item .material-icons { font-size: 1.25rem; color: var(--secondary-color); margin-top: 2px; }
.card-body .info-item p { font-size: .9rem; color: var(--on-background-color); }
.card-body .info-item p strong { color: var(--on-surface-color); font-weight: 500; }
.card-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-color); font-size: .8rem; color: #aaa; text-align: right; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,.8); display: flex; justify-content: center; align-items: center; z-index: 1000; animation: fadeIn .3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content { background-color: #2a2a2a; padding: 2.5rem; border-radius: 16px; width: 90%; max-width: 650px; border: 1px solid var(--border-color); max-height: 90vh; overflow-y: auto; animation: slideIn .3s cubic-bezier(.25,1,.5,1); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
@keyframes slideIn { from { transform: translateY(-30px) scale(.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
.modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; margin-bottom: 1.5rem; }
.modal-header h2 { color: var(--on-surface-color); font-size: 1.75rem; }
.close-button { background: none; border: none; font-size: 2.5rem; color: var(--on-background-color); cursor: pointer; line-height: 1; transition: color .2s ease, transform .2s ease; }
.close-button:hover { color: var(--on-surface-color); transform: rotate(90deg); }
.modal-body .detail-item { display: grid; grid-template-columns: 150px 1fr; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--border-color); }
.modal-body .detail-item:last-child { border-bottom: none; }
.modal-body .detail-label { font-weight: 500; color: var(--secondary-color); display: flex; align-items: center; gap: .5rem; }
.modal-body .detail-label .material-icons { font-size: 1.25rem; }
.modal-body .detail-value { color: var(--on-background-color); }
.status-tag { padding: .25rem .75rem; border-radius: 6px; font-size: .9rem; font-weight: 500; display: inline-block; }
.modal-footer { padding-top: 1.5rem; margin-top: 1.5rem; text-align: right; border-top: 1px solid var(--border-color); }
.map-button { background-color: var(--primary-color); color: #000; font-weight: 700; border: none; cursor: pointer; transition: background-color .3s ease, transform .2s ease; padding: .8rem 1.5rem; border-radius: 8px; font-size: 1rem; display: inline-flex; align-items: center; gap: .5rem; }
.map-button:hover { background-color: #01bfa5; transform: translateY(-2px); }
.app-footer { background-color: var(--surface-color); padding: 1.5rem 2rem; border-top: 1px solid var(--border-color); text-align: center; color: #888; font-size: .9rem; margin-top: auto; }
@media (max-width: 992px) { .container { grid-template-columns: 1fr; padding: 1.5rem; } .controls { position: static; top: auto; } }
@media (max-width: 768px) {
  .app-header h1 { font-size: 1.5rem; }
  .app-header h1 .material-icons { font-size: 2rem; }
  .container { padding: 1rem; }
  .controls { padding: 1.5rem; }
  .modal-content { padding: 1.5rem; }
  .modal-header h2 { font-size: 1.25rem; }
  .modal-body .detail-item { grid-template-columns: 120px 1fr; }
}
  </style>

  <!-- React + ReactDOM + Babel (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <noscript>이 앱을 사용하려면 JavaScript가 필요합니다.</noscript>
  <div id="root"></div>

  <!-- ====== 앱 코드 (JSX), UMD 전역 사용: import 없음 ====== -->
  <script type="text/babel" data-presets="react">
    const { useState, useCallback, Fragment } = React;
    const { createRoot } = ReactDOM;

    const API_ENDPOINT = 'https://apis.data.go.kr/B552584/EvCharger/getChargerInfo';
    const SERVICE_KEY = 'jVwm8WYdMpGK4BqfwpN6eZvd0gaG5oJ5HihWrIhNwhaEdvvtLZHVaChaUQh8fO5GaWlRqxFROPnItSiO7/lf+A==';

    const DISTRICTS = {
      '종로구': '11110','중구': '11140','용산구': '11170','성동구': '11200','광진구': '11215',
      '동대문구': '11230','중랑구': '11260','성북구': '11290','강북구': '11305','도봉구': '11320',
      '노원구': '11350','은평구': '11380','서대문구': '11410','마포구': '11440','양천구': '11470',
      '강서구': '11500','구로구': '11530','금천구': '11545','영등포구': '11560','동작구': '11590',
      '관악구': '11620','서초구': '11650','강남구': '11680','송파구': '11710','강동구': '11740',
    };

    const POWER_OPTIONS = ['200','100','50','40','14','7'];

    const STATUS_MAP = {
      '1': { text: '통신이상', color: '#ffffff', background: '#f44336' },
      '2': { text: '충전 가능', color: '#ffffff', background: '#4caf50' },
      '3': { text: '충전중', color: '#ffffff', background: '#ff9800' },
      '4': { text: '운영중지', color: '#ffffff', background: '#9e9e9e' },
      '5': { text: '점검중', color: '#ffffff', background: '#2196f3' },
      '9': { text: '상태미확인', color: '#ffffff', background: '#607d8b' },
    };

    const formatDateTime = (dt) => {
      if (!dt || dt.length < 14) return '정보 없음';
      const year = dt.substring(0, 4);
      const month = dt.substring(4, 6);
      const day = dt.substring(6, 8);
      const hour = dt.substring(8, 10);
      const minute = dt.substring(10, 12);
      return `${year}-${month}-${day} ${hour}:${minute}`;
    };

    const InfoItem = ({ icon, label, value }) => (
      <div className="info-item">
        <i className="material-icons">{icon}</i>
        <p><strong>{label}:</strong> {value}</p>
      </div>
    );

    const ChargerCard = ({ charger, onClick }) => {
      const onKeyDown = (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(charger); }
      };
      return (
        <div className="charger-card" role="button" tabIndex={0} onClick={() => onClick(charger)} onKeyDown={onKeyDown} aria-label={`${charger.statNm} 상세 보기`}>
          <div className="card-header">
            <h3>{charger.statNm}</h3>
            {charger.stat === '2' && <div className="status-badge available">충전 가능</div>}
          </div>
          <div className="card-body">
            <InfoItem icon="location_on" label="주소" value={charger.addr} />
            <InfoItem icon="power" label="출력" value={charger.output ? `${charger.output}kW` : '정보 없음'} />
            <InfoItem icon="business" label="운영기관" value={charger.bnm} />
            <InfoItem icon="schedule" label="이용시간" value={charger.useTime || '정보 없음'} />
            <InfoItem icon="local_parking" label="주차" value={charger.parkingFree === 'Y' ? '무료' : '유료/정보 없음'} />
          </div>
          <div className="card-footer">업데이트: {formatDateTime(charger.statUpdDt)}</div>
        </div>
      );
    };

    const ChargerDetailsModal = ({ charger, onClose }) => {
      if (!charger) return null;
      const statusInfo = STATUS_MAP[charger.stat] || STATUS_MAP['9'];
      const handleMapRedirect = () => { window.open(`https://maps.google.com/?q=${encodeURIComponent(charger.addr)}`, '_blank'); };
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h2>{charger.statNm}</h2>
              <button className="close-button" onClick={onClose} aria-label="닫기">&times;</button>
            </div>
            <div className="modal-body">
              <div className="detail-item">
                <span className="detail-label"><i className="material-icons">info</i>상태</span>
                <span className="detail-value">
                  <span className="status-tag" style={{ backgroundColor: statusInfo.background, color: statusInfo.color }}>{statusInfo.text}</span>
                </span>
              </div>
              <div className="detail-item"><span className="detail-label"><i className="material-icons">location_on</i>주소</span><span className="detail-value">{charger.addr}</span></div>
              <div className="detail-item"><span className="detail-label"><i className="material-icons">power</i>출력</span><span className="detail-value">{charger.output ? `${charger.output}kW` : '정보 없음'}</span></div>
              <div className="detail-item"><span className="detail-label"><i className="material-icons">business</i>운영기관</span><span className="detail-value">{charger.bnm}</span></div>
              <div className="detail-item"><span className="detail-label"><i className="material-icons">call</i>연락처</span><span className="detail-value">{charger.busiCall || '정보 없음'}</span></div>
              <div className="detail-item"><span className="detail-label"><i className="material-icons">schedule</i>이용시간</span><span className="detail-value">{charger.useTime || '정보 없음'}</span></div>
              <div className="detail-item"><span className="detail-label"><i className="material-icons">local_parking</i>주차</span><span className="detail-value">{charger.parkingFree === 'Y' ? '무료' : '유료/정보 없음'}</span></div>
              <div className="detail-item"><span className="detail-label"><i className="material-icons">update</i>마지막 업데이트</span><span className="detail-value">{formatDateTime(charger.statUpdDt)}</span></div>
            </div>
            <div className="modal-footer">
              <button className="map-button" onClick={handleMapRedirect}><i className="material-icons">map</i>지도에서 보기</button>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [district, setDistrict] = useState('');
      const [power, setPower] = useState('');
      const [chargers, setChargers] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState('');
      const [selectedCharger, setSelectedCharger] = useState(null);

      const handleSearch = useCallback(async () => {
        if (!district) { setError('지역구를 선택해주세요.'); return; }
        setIsLoading(true); setError(''); setChargers(null);

        const zscode = DISTRICTS[district];
        const params = new URLSearchParams({
          serviceKey: SERVICE_KEY, pageNo: '1', numOfRows: '100', dataType: 'JSON', zcode: '11', zscode
        });

        try {
          const res = await fetch(`${API_ENDPOINT}?${params.toString()}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          let items = data?.items?.item || [];
          if (!Array.isArray(items) && items) items = [items];

          let filtered = items.filter(c => c.stat === '2' && (!power || (c.output && Number(c.output) >= Number(power))));
          filtered.sort((a, b) => (Number(b.output) || 0) - (Number(a.output) || 0));
          setChargers(filtered);
        } catch (e) {
          console.error(e);
          setError('데이터를 불러오는 데 실패했습니다. 잠시 후 다시 시도해주세요.');
        } finally {
          setIsLoading(false);
        }
      }, [district, power]);

      const openModal = (c) => setSelectedCharger(c);
      const closeModal = () => setSelectedCharger(null);

      return (
        <Fragment>
          <header className="app-header">
            <h1><i className="material-icons">ev_station</i> 서울시 전기차 충전소</h1>
            <p>서울시의 이용 가능한 전기차 충전소를 실시간으로 검색합니다.</p>
          </header>

          <main className="container">
            <aside className="controls">
              <h2>충전소 검색</h2>
              <div className="form-group">
                <label htmlFor="district-select">지역구</label>
                <select id="district-select" value={district} onChange={(e) => setDistrict(e.target.value)}>
                  <option value="">지역구를 선택하세요</option>
                  {Object.keys(DISTRICTS).map(d => <option key={d} value={d}>{d}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label htmlFor="power-select">최소 출력 (kW)</label>
                <select id="power-select" value={power} onChange={(e) => setPower(e.target.value)}>
                  <option value="">전체</option>
                  {POWER_OPTIONS.map(p => <option key={p} value={p}>{p}kW 이상</option>)}
                </select>
              </div>
              <div className="form-group">
                <button className="search-button" onClick={handleSearch} disabled={isLoading}>
                  {isLoading ? '검색중...' : (<><i className="material-icons">search</i><span>검색하기</span></>)}
                </button>
              </div>
            </aside>

            <section className="results">
              {isLoading && (
                <div className="loader">
                  <div className="spinner"></div>
                  <p>충전소 정보를 불러오는 중입니다...</p>
                </div>
              )}
              {error && <div className="message-box error"><p>{error}</p></div>}
              {!isLoading && !error && chargers && (
                chargers.length > 0 ? (
                  <div className="results-grid">
                    {chargers.map((charger) => (
                      <ChargerCard key={`${charger.statId}-${charger.chgerId}`} charger={charger} onClick={openModal} />
                    ))}
                  </div>
                ) : (
                  <div className="message-box"><p>검색 조건에 맞는 충전소가 없습니다.</p></div>
                )
              )}
              {!isLoading && !error && chargers === null && (
                <div className="message-box initial-prompt">
                  <i className="material-icons">explore</i>
                  <p>지역구와 출력량을 선택하고 검색하세요.</p>
                </div>
              )}
            </section>
          </main>

          <footer className="app-footer">
            <p>&copy; 2024 EV-Finder Seoul. All Rights Reserved.</p>
          </footer>

          <ChargerDetailsModal charger={selectedCharger} onClose={closeModal} />
        </Fragment>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
